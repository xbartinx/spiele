<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>
window.onerror=function(m,s,l,c){if(/^Script error\.?$/.test(String(m))&&!l)return true;try{var d=document.getElementById('err');if(!d){d=document.createElement('pre');d.id='err';
d.onclick=function(){d.remove()};d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99;margin:0;padding:14px 12px 30px;background:#a00;color:#fff;font:14px Menlo,monospace;white-space:pre-wrap';
(document.body||document.documentElement).appendChild(d);}d.textContent+='FEHLER: '+m+' (Zeile '+l+':'+c+')\n';
var b=document.getElementById('boot');if(b)b.remove();}catch(e){}};
window.addEventListener('unhandledrejection',function(e){window.onerror('Promise: '+(e.reason&&e.reason.message||e.reason),'',0,0);});
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>SPIELE.EXE</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#0000aa;--fg:#aaaaaa;--hi:#fff;--cy:#00aaaa;--lcy:#55ffff;--ye:#ffff55;--rd:#ff5555;--gr:#55ff55;--dim:#6a6ac8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;overscroll-behavior:none}
body{font-family:'VT323',ui-monospace,Menlo,monospace;font-size:21px;line-height:1.15;color:var(--fg);-webkit-text-size-adjust:100%;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{display:flex;flex-direction:column;height:100%;max-width:600px;margin:0 auto;background:var(--bg)}
.hidden{display:none!important}
.bar{background:var(--fg);color:#000;padding:2px 8px;display:flex;justify-content:space-between;white-space:nowrap;gap:8px;align-items:center}
.bar button{font:inherit;background:#000;color:var(--fg);border:0;padding:0 8px;cursor:pointer;border-radius:0}
fieldset{margin:4px 6px;border:4px double var(--hi);padding:2px 6px 6px;min-width:0;min-height:0}
legend{color:var(--hi);padding:0 6px}
#menu fieldset{flex:1;overflow-y:auto}
.mi{display:flex;gap:10px;padding:5px 6px;cursor:pointer;align-items:baseline}
.mi:active{background:var(--cy);color:#000}
.mi .k{color:var(--ye);width:1.2em;flex:none}
.mi .n{color:var(--hi);width:7.2em;flex:none}
.mi .d{color:var(--dim);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi:active .n,.mi:active .d,.mi:active .k{color:#000}
.foot{color:var(--dim);font-size:17px;text-align:center;padding:4px}
/* Optionen */
#opts .row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:8px 0}
#opts .lab{color:var(--ye);width:100%}
#opts label{cursor:pointer;color:var(--fg);white-space:nowrap}
#opts input[type=radio]{display:none}
#opts input[type=radio]+span::before{content:'( ) '}
#opts input[type=radio]:checked+span{color:var(--hi)}
#opts input[type=radio]:checked+span::before{content:'(•) ';color:var(--gr)}
#opts input[type=number]{width:4.2em;font:inherit;font-size:20px;background:#000;color:var(--hi);border:0;padding:2px 6px;border-radius:0}
#optHelp{color:var(--dim);font-size:18px;white-space:pre-wrap;margin-top:10px}
.btn{font:inherit;font-size:22px;border:0;border-radius:0;background:#aaa;color:#000;box-shadow:4px 4px 0 #000;padding:4px 14px;cursor:pointer;margin:8px 8px 0 0}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn.g{background:#00aa00;color:#fff}.btn.c{background:var(--cy)}
/* Spiel */
#stage{flex:1;position:relative;min-height:0;margin:4px 6px 0;touch-action:none}

#pad button.on{transform:translate(4px,4px);box-shadow:none;background:var(--ye)}
#pad button.t{background:var(--cy)}
#pad button.r{background:#aa0000;color:#fff}
/* Dialog */
#dlg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:10}
#dlg .box{background:#aaaaaa;color:#000;border:4px double #000;box-shadow:8px 8px 0 #000;padding:8px 14px 14px;min-width:260px;max-width:88%;text-align:center}
#dlg .tt{background:#000;color:var(--hi);margin:-8px -14px 8px;padding:2px}
#dlg .tx{white-space:pre-wrap;font-size:22px}
#dlg .btn{box-shadow:4px 4px 0 #555}
</style>

<body>
<div class="screen" id="menu">
  <div class="bar"><span>SPIELE.EXE</span><span class="clock">--:--</span></div>
  <fieldset><legend>[ SPIEL WÄHLEN ]</legend><div id="mlist"></div></fieldset>
  <div class="foot">Spielstände & Rekorde bleiben auf dem Gerät</div>
</div>

<div class="screen hidden" id="opts">
  <div class="bar"><span id="oTitle">SPIEL</span><button id="oBack">ESC Menü</button></div>
  <fieldset style="flex:1;overflow-y:auto"><legend id="oLegend">[ OPTIONEN ]</legend>
    <div id="oRows"></div>
    <button class="btn g" id="oStart">► START</button>
    <div id="optHelp"></div>
  </fieldset>
</div>

<div class="screen hidden" id="game">
  <div class="bar"><span id="gTitle">SPIEL</span><span><button id="gNew">NEU</button> <button id="gBack">ESC</button></span></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="status"></div>
  <div id="pad"></div>
</div>

<div id="dlg" class="hidden"><div class="box"><div class="tt" id="dlgT">INFO</div><div class="tx" id="dlgX"></div><div id="dlgB"></div></div></div>

<script>
'use strict';
/* ===================== CORE ===================== */
const $ = id => document.getElementById(id);
const C = {k: '#000000', b: '#0000aa', g: '#00aa00', c: '#00aaaa', r: '#aa0000', m: '#aa00aa', br: '#aa5500', lg: '#aaaaaa',
  dg: '#555555', B: '#5555ff', G: '#55ff55', Cy: '#55ffff', R: '#ff5555', M: '#ff55ff', Y: '#ffff55', W: '#ffffff'};
const FONT = "VT323, ui-monospace, Menlo, monospace";
const store = {
  get(k, d) { try { const v = localStorage.getItem('spiele.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('spiele.' + k, JSON.stringify(v)); } catch (e) {} }
};
const GAMES = [];
function addGame(g) { GAMES.push(g); }
const cv = $('cv'); const ctx = cv.getContext('2d');
let W = 300, H = 300, DPR = 1, inst = null, curGame = null, curOpts = null, raf = 0, lastTs = 0, dirty = true;

function show(id) { ['menu', 'opts', 'game'].forEach(s => $(s).classList.toggle('hidden', s !== id)); }
function hhmm(d) { return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
setInterval(() => document.querySelectorAll('.clock').forEach(c => c.textContent = hhmm(new Date())), 10000);

function status(t) { $('status').textContent = t; }
function redraw() { dirty = true; }
function txt(s, x, y, size, col, align, base) {
  ctx.font = size + 'px ' + FONT; ctx.fillStyle = col; ctx.textAlign = align || 'left'; ctx.textBaseline = base || 'alphabetic'; ctx.fillText(s, x, y);
}
function box(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function frameRect(x, y, w, h, col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw || 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1); }
function circle(x, y, r, col, stroke, lw) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (col) { ctx.fillStyle = col; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); } }
const later = (fn, ms) => setTimeout(fn, ms || 30);
function rnd(a, b) { return a + Math.random() * (b - a); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- Dialog ---------- */
function dialog(title, text, buttons) {
  $('dlgT').textContent = title; $('dlgX').textContent = text; const b = $('dlgB'); b.textContent = '';
  (buttons || [{label: 'OK'}]).forEach(x => { const e = document.createElement('button'); e.className = 'btn ' + (x.cls || ''); e.textContent = x.label;
    e.onclick = () => { $('dlg').classList.add('hidden'); if (x.fn) x.fn(); }; b.appendChild(e); });
  $('dlg').classList.remove('hidden');
}
function gameOver(title, text) {
  dialog(title, text, [{label: 'NOCHMAL', cls: 'g', fn: () => startGame(curGame, curOpts)}, {label: 'MENÜ', fn: () => quitGame()}]);
}

/* ---------- Menü & Optionen ---------- */
function buildMenu() {
  const L = $('mlist'); L.textContent = '';
  GAMES.forEach((g, i) => {
    const r = document.createElement('div'); r.className = 'mi';
    const k = document.createElement('span'); k.className = 'k'; k.textContent = (i + 1);
    const n = document.createElement('span'); n.className = 'n'; n.textContent = g.name;
    const d = document.createElement('span'); d.className = 'd'; d.textContent = g.desc;
    r.append(k, n, d); r.onclick = () => openOpts(g); L.appendChild(r);
  });
}
function openOpts(g) {
  curGame = g;
  if (!g.options || !g.options.length) { startGame(g, {}); return; }
  $('oTitle').textContent = g.name.toUpperCase() + '.EXE'; $('oLegend').textContent = '[ ' + g.name.toUpperCase() + ' ]';
  const saved = store.get('opt.' + g.id, {});
  const R = $('oRows'); R.textContent = '';
  g.options.forEach(o => {
    const row = document.createElement('div'); row.className = 'row'; row.dataset.opt = o.id;
    const lab = document.createElement('div'); lab.className = 'lab'; lab.textContent = o.label; row.appendChild(lab);
    if (o.type === 'num') {
      const inp = document.createElement('input'); inp.type = 'number'; inp.min = o.min; inp.max = o.max; inp.value = saved[o.id] != null ? saved[o.id] : o.def; inp.inputMode = 'numeric';
      inp.dataset.id = o.id; row.appendChild(inp);
      if (o.unit) { const u = document.createElement('span'); u.textContent = o.unit; row.appendChild(u); }
    } else {
      const cur = saved[o.id] != null ? saved[o.id] : o.def;
      o.choices.forEach(([v, t]) => { const l = document.createElement('label'); const i = document.createElement('input'); i.type = 'radio'; i.name = 'o_' + o.id; i.value = v;
        if (String(v) === String(cur)) i.checked = true; i.onchange = () => updateOptVis(g); const s = document.createElement('span'); s.textContent = t; l.append(i, s); row.appendChild(l); });
    }
    R.appendChild(row);
  });
  $('optHelp').textContent = g.help || '';
  updateOptVis(g); show('opts');
}
function readOpts(g) {
  const o = {};
  g.options.forEach(x => {
    if (x.type === 'num') { const v = parseInt(document.querySelector('[data-id="' + x.id + '"]').value, 10); o[x.id] = Math.max(x.min, Math.min(x.max, isNaN(v) ? x.def : v)); }
    else { const c = document.querySelector('input[name="o_' + x.id + '"]:checked'); o[x.id] = c ? c.value : String(x.def); }
  });
  return o;
}
function updateOptVis(g) {
  const o = readOpts(g);
  g.options.forEach(x => { if (x.showIf) document.querySelector('[data-opt="' + x.id + '"]').classList.toggle('hidden', !x.showIf(o)); });
}
$('oStart').onclick = () => { const o = readOpts(curGame); store.set('opt.' + curGame.id, o); startGame(curGame, o); };
$('oBack').onclick = () => show('menu');

/* ---------- Spiel starten / beenden ---------- */
function startGame(g, opts) {
  stopGame(); curGame = g; curOpts = opts;
  $('gTitle').textContent = g.name.toUpperCase();
  show('game'); status(''); $('pad').textContent = '';
  resize();
  inst = g.create(opts || {});
  if (inst.resize) inst.resize(W, H);
  dirty = true; lastTs = 0; raf = requestAnimationFrame(loop);
}
function stopGame() { cancelAnimationFrame(raf); if (inst && inst.destroy) inst.destroy(); inst = null; held.clear(); $('dlg').classList.add('hidden'); }
function quitGame() { stopGame(); show('menu'); }
$('gBack').onclick = () => { if (curGame.options && curGame.options.length) { stopGame(); openOpts(curGame); } else quitGame(); };
$('gNew').onclick = () => startGame(curGame, curOpts);
function loop(ts) {
  raf = requestAnimationFrame(loop);
  if (!inst) return;
  const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016; lastTs = ts;
  if (document.hidden) return;
  if (inst.frame) { inst.frame(dt); dirty = true; }
  if (dirty) { dirty = false; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); box(0, 0, W, H, C.k); inst.draw(); }
}
function resize() {
  const r = $('stage').getBoundingClientRect(); DPR = Math.min(3, window.devicePixelRatio || 1);
  W = Math.max(100, Math.floor(r.width)); H = Math.max(100, Math.floor(r.height));
  cv.width = W * DPR; cv.height = H * DPR;
  if (inst && inst.resize) inst.resize(W, H); dirty = true;
}
window.addEventListener('resize', () => { if (inst) resize(); });

/* ---------- Eingabe ---------- */
const ptrs = new Map();
function pos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const [x, y] = pos(e); ptrs.set(e.pointerId, {x0: x, y0: y, t0: performance.now(), x, y});
  if (inst && inst.down) inst.down(x, y, e.pointerId); });
cv.addEventListener('pointermove', e => { const p = ptrs.get(e.pointerId); if (!p) return; const [x, y] = pos(e); p.x = x; p.y = y; if (inst && inst.move) inst.move(x, y, e.pointerId); });
function ptrEnd(e) {
  const p = ptrs.get(e.pointerId); if (!p) return; ptrs.delete(e.pointerId);
  const [x, y] = pos(e); if (inst && inst.up) inst.up(x, y, e.pointerId);
  const dx = x - p.x0, dy = y - p.y0, dist = Math.hypot(dx, dy), dt = performance.now() - p.t0;
  if (!inst) return;
  if (dist > 28 && inst.swipe) inst.swipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  else if (dist <= 12 && inst.tap) inst.tap(p.x0, p.y0, dt);
}
cv.addEventListener('pointerup', ptrEnd);
cv.addEventListener('pointercancel', ptrEnd);
cv.addEventListener('contextmenu', e => e.preventDefault());
// Steuerknöpfe
const held = new Set();
function setPad(btns) {
  const P = $('pad'); P.textContent = '';
  btns.forEach(b => {
    const e = document.createElement('button'); e.textContent = b.label; if (b.cls) e.className = b.cls;
    if (b.flex) e.style.flex = b.flex;
    const dn = ev => { ev.preventDefault(); e.classList.add('on'); held.add(b.key); if (inst && inst.key) inst.key(b.key, true); };
    const upf = ev => { ev.preventDefault(); if (!held.has(b.key)) return; e.classList.remove('on'); held.delete(b.key); if (inst && inst.key) inst.key(b.key, false); };
    e.addEventListener('pointerdown', dn); e.addEventListener('pointerup', upf); e.addEventListener('pointercancel', upf); e.addEventListener('pointerleave', upf);
    e.addEventListener('contextmenu', ev => ev.preventDefault());
    P.appendChild(e);
  });
  later(resize, 0);
}
const KEYMAP = {ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', ' ': 'fire', Enter: 'enter', z: 'rot', x: 'rot', f: 'flag', c: 'hold'};
document.addEventListener('keydown', e => {
  if ($('game').classList.contains('hidden')) return;
  if (e.key === 'Escape') { $('gBack').click(); return; }
  const k = KEYMAP[e.key]; if (k && inst && inst.key) { e.preventDefault(); if (!e.repeat || k === 'left' || k === 'right' || k === 'down') inst.key(k, true); }
});
document.addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k && inst && inst.key) inst.key(k, false); });

/* ---------- Gemeinsames für Brettspiele ---------- */
const OPT_MODE = {id: 'mode', label: 'GEGNER', choices: [['cpu', '1 Spieler (gegen Computer)'], ['2p', '2 Spieler (abwechselnd)']], def: 'cpu'};
const OPT_LVL = {id: 'lvl', label: 'STÄRKE', choices: [['1', 'Leicht'], ['2', 'Mittel'], ['3', 'Schwer']], def: '2', showIf: o => o.mode === 'cpu'};
const OPT_SIDE = {id: 'side', label: 'DU SPIELST', choices: [['0', 'Zuerst'], ['1', 'Als Zweiter']], def: '0', showIf: o => o.mode === 'cpu'};

/* ===================== 4 GEWINNT ===================== */
addGame({
  id: 'c4', name: '4 Gewinnt', desc: 'Vier in eine Reihe',
  options: [OPT_MODE, OPT_LVL, OPT_SIDE],
  help: 'Tippe auf eine Spalte, um einen Stein einzuwerfen.',
  create(o) {
    const COLS = 7, ROWS = 6, ORDER = [3, 2, 4, 1, 5, 0, 6];
    const cpu = o.mode === 'cpu', human = cpu ? +o.side : -1, depth = {1: 2, 2: 5, 3: 7}[o.lvl] || 5;
    let b = [], turn = 0, over = false, anim = null, win = null, cell, ox, oy, thinking = false, hover = 3;
    for (let r = 0; r < ROWS; r++) b.push(new Array(COLS).fill(-1));
    const names = cpu ? ['Du', 'CPU'] : ['ROT', 'GELB'];
    const pname = p => cpu ? (p === human ? 'Du' : 'CPU') : (p === 0 ? 'ROT' : 'GELB');
    const col = p => p === 0 ? C.R : C.Y;
    function freeRow(c) { for (let r = ROWS - 1; r >= 0; r--) if (b[r][c] < 0) return r; return -1; }
    function lines(bd, p) {      // gibt Gewinnlinie zurück
      const D = [[0, 1], [1, 0], [1, 1], [1, -1]];
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (bd[r][c] === p)
        for (const [dr, dc] of D) { const L = [[r, c]]; for (let k = 1; k < 4; k++) { const rr = r + dr * k, cc = c + dc * k; if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS || bd[rr][cc] !== p) break; L.push([rr, cc]); } if (L.length === 4) return L; }
      return null;
    }
    function full(bd) { return bd[0].every(v => v >= 0); }
    function scoreWin(w, p) { let me = 0, op = 0, em = 0; for (const v of w) { if (v === p) me++; else if (v < 0) em++; else op++; }
      if (me === 4) return 1000; if (me === 3 && em === 1) return 6; if (me === 2 && em === 2) return 2; if (op === 3 && em === 1) return -5; return 0; }
    function evalB(bd, p) {
      let s = 0;
      for (let r = 0; r < ROWS; r++) { if (bd[r][3] === p) s += 3; else if (bd[r][3] >= 0) s -= 3; }
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        if (c + 3 < COLS) s += scoreWin([bd[r][c], bd[r][c + 1], bd[r][c + 2], bd[r][c + 3]], p);
        if (r + 3 < ROWS) s += scoreWin([bd[r][c], bd[r + 1][c], bd[r + 2][c], bd[r + 3][c]], p);
        if (r + 3 < ROWS && c + 3 < COLS) s += scoreWin([bd[r][c], bd[r + 1][c + 1], bd[r + 2][c + 2], bd[r + 3][c + 3]], p);
        if (r + 3 < ROWS && c - 3 >= 0) s += scoreWin([bd[r][c], bd[r + 1][c - 1], bd[r + 2][c - 2], bd[r + 3][c - 3]], p);
      }
      return s;
    }
    function negamax(bd, d, a, beta, p) {
      if (lines(bd, 1 - p)) return -100000 - d;
      if (full(bd)) return 0;
      if (d === 0) return evalB(bd, p);
      let best = -Infinity;
      for (const c of ORDER) { let r = -1; for (let rr = ROWS - 1; rr >= 0; rr--) if (bd[rr][c] < 0) { r = rr; break; } if (r < 0) continue;
        bd[r][c] = p; const v = -negamax(bd, d - 1, -beta, -a, 1 - p); bd[r][c] = -1;
        if (v > best) best = v; if (v > a) a = v; if (a >= beta) break; }
      return best;
    }
    function cpuMove() {
      thinking = true; status('CPU denkt…');
      later(() => {
        const bd = b.map(r => r.slice()); let best = -Infinity, bc = 3; const cand = [];
        for (const c of ORDER) { const r = freeRow(c); if (r < 0) continue; bd[r][c] = turn; const v = -negamax(bd, depth - 1, -Infinity, Infinity, 1 - turn); bd[r][c] = -1;
          cand.push([c, v]); if (v > best) { best = v; bc = c; } }
        if (o.lvl === '1' && Math.random() < 0.3 && cand.length) bc = cand[Math.floor(Math.random() * cand.length)][0];
        thinking = false; drop(bc);
      }, 250);
    }
    function drop(c) {
      if (over || anim) return; const r = freeRow(c); if (r < 0) return;
      anim = {c, r, y: -1, v: 0, p: turn};
    }
    function land() {
      b[anim.r][anim.c] = anim.p; const p = anim.p; anim = null;
      const L = lines(b, p);
      if (L) { win = L; over = true; status(pname(p) + ' gewinnt!'); redraw(); later(() => gameOver('SPIELENDE', (cpu ? (p === human ? 'Du hast gewonnen!' : 'Der Computer gewinnt.') : pname(p) + ' gewinnt!')), 900); return; }

addGame({

    const N = 4;
    let g = [], score = 0, best = store.get('best2048', 0), cell, ox, oy, won = false, anims = [], pop = new Map(), t = 0;

      const [r, c] = e[Math.floor(Math.random() * e.length)]; g[r][c] = Math.random() < 0.9 ? 2 : 4; pop.set(r + ',' + c, 0); }

    function moveDir(dir) {
      if (anims.length) return;
      const dr = {up: -1, down: 1, left: 0, right: 0}[dir], dc = {up: 0, down: 0, left: -1, right: 1}[dir];
      let moved = false; const merged = new Set(); const mv = [];
      const rs = [...Array(N).keys()], cs = [...Array(N).keys()]; if (dr > 0) rs.reverse(); if (dc > 0) cs.reverse();
      const ng = g.map(r => r.slice());
      for (const r of rs) for (const c of cs) {
        const v = ng[r][c]; if (!v) continue; let rr = r, cc = c;
        while (true) { const nr = rr + dr, nc = cc + dc; if (nr < 0 || nr >= N || nc < 0 || nc >= N) break;
          if (!ng[nr][nc]) { rr = nr; cc = nc; continue; }
          if (ng[nr][nc] === v && !merged.has(nr + ',' + nc)) { rr = nr; cc = nc; break; } break; }
        if (rr !== r || cc !== c) { moved = true; mv.push({v, r0: r, c0: c, r1: rr, c1: cc});
          ng[r][c] = 0; if (ng[rr][cc] === v) { ng[rr][cc] = v * 2; score += v * 2; merged.add(rr + ',' + cc); pop.set(rr + ',' + cc, 0); } else ng[rr][cc] = v; }
      }
      if (!moved) return;
      anims = mv.map(m => Object.assign(m, {t: 0}));
      const after = () => { g = ng; addTile(); anims = []; if (score > best) { best = score; store.set('best2048', best); }
        upd();
        if (!won && g.some(r => r.some(v => v >= 2048))) { won = true; dialog('GESCHAFFT!', '2048 erreicht!\nPunkte: ' + score, [{label: 'WEITER', cls: 'g'}, {label: 'NEU', fn: () => startGame(curGame, curOpts)}]); }
        else if (!canMove()) later(() => gameOver('SPIELENDE', 'Keine Züge mehr.\nPunkte: ' + score + '\nRekord: ' + best), 400); };

    addTile(); addTile(); upd();
    function tileAt(x, y, v, s) {
      const [bg, fg] = COL[v] || [C.W, C.k]; const pad = cell * 0.06, w = (cell - pad * 2) * (s || 1);

/* ===================== DAME (Checkers) ===================== */
addGame({
  id: 'dame', name: 'Dame', desc: 'Checkers mit fliegender Dame',
  options: [OPT_MODE, OPT_LVL, OPT_SIDE],
  help: 'Regeln: Steine ziehen schräg vorwärts, schlagen vorwärts und rückwärts.\nSchlagzwang! Mehrfachschlagen in einem Zug.\nWer die letzte Reihe erreicht, wird zur Dame – sie zieht und schlägt beliebig weit.\nTippe einen Stein, dann das Zielfeld.',
  create(o) {
    const cpu = o.mode === 'cpu', humanSide = cpu ? (o.side === '0' ? 1 : -1) : 0, depth = {1: 2, 2: 4, 3: 6}[o.lvl] || 4;
    const flip = cpu && humanSide === -1;
    let bd = new Array(64).fill(0), side = 1, sel = -1, moves = [], over = false, cell, ox, oy, last = null, thinking = false, anim = null;
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if ((r + c) % 2 === 1) { if (r < 3) bd[r * 8 + c] = -1; else if (r > 4) bd[r * 8 + c] = 1; }
    const DIRS = [[-1, -1], [-1, 1], [1, -1], [1, 1]];

      const caps = [], simple = [];
      for (let i = 0; i < 64; i++) { const v = b[i]; if (!v || Math.sign(v) !== s) continue;
        const king = Math.abs(v) === 2, r0 = i >> 3, c0 = i & 7;
        // Schlagen (DFS)
        b[i] = 0;
        const dfs = (pos, path, capd) => {
          const r = pos >> 3, c = pos & 7; let found = false;
          for (const [dr, dc] of DIRS) {
            if (king) {
              let rr = r + dr, cc = c + dc; while (inB(rr, cc) && b[rr * 8 + cc] === 0) { rr += dr; cc += dc; }
              if (!inB(rr, cc)) continue; const ov = rr * 8 + cc;
              if (Math.sign(b[ov]) !== -s || capd.includes(ov)) continue;
              let lr = rr + dr, lc = cc + dc;
              while (inB(lr, lc) && b[lr * 8 + lc] === 0) { found = true; dfs(lr * 8 + lc, path.concat(lr * 8 + lc), capd.concat(ov)); lr += dr; lc += dc; }
            } else {
              const orr = r + dr, oc = c + dc, lr = r + 2 * dr, lc = c + 2 * dc;
              if (!inB(lr, lc)) continue; const ov = orr * 8 + oc, ld = lr * 8 + lc;
              if (Math.sign(b[ov]) === -s && !capd.includes(ov) && b[ld] === 0) { found = true; dfs(ld, path.concat(ld), capd.concat(ov)); }
            }
          }
          if (!found && capd.length) caps.push({from: i, path, caps: capd});
        };
        dfs(i, [], []);
        b[i] = v;
        if (!caps.length) {
          for (const [dr, dc] of DIRS) {
            if (!king && dr !== -s) continue;

            while (inB(rr, cc) && b[rr * 8 + cc] === 0) { simple.push({from: i, path: [rr * 8 + cc], caps: []}); if (!king) break; rr += dr; cc += dc; }
          }
        }
      }
      return caps.length ? caps : simple;
    }
    function apply(b, m) {
      const v = b[m.from]; b[m.from] = 0; m.caps.forEach(x => b[x] = 0);
      const to = m.path[m.path.length - 1], r = to >> 3;
      b[to] = (Math.abs(v) === 1 && ((v > 0 && r === 0) || (v < 0 && r === 7))) ? v * 2 : v;
    }
    function evalB(b, s) {
      let sc = 0;
      for (let i = 0; i < 64; i++) { const v = b[i]; if (!v) continue; const r = i >> 3, c = i & 7;
        let w = Math.abs(v) === 2 ? 320 : 100 + (v > 0 ? (7 - r) : r) * 3; if (c >= 2 && c <= 5) w += 4; if (Math.abs(v) === 1 && ((v > 0 && r === 7) || (v < 0 && r === 0))) w += 6;
        sc += Math.sign(v) === s ? w : -w; }

    }

      for (const m of ms) { const nb = b.slice(); apply(nb, m); const v = -negamax(nb, d - 1, -beta, -a, -s); if (v > best) best = v; if (v > a) a = v; if (a >= beta) break; }

    function fromBag() { if (!bag.length) bag = shuffle(Object.keys(SH)); return bag.pop(); }
    function piece(t) { const m = SH[t].map(r => r.slice()); return {t, m, x: Math.floor((BW - m.length) / 2), y: t === 'I' ? -1 : 0}; }
    function rot(m) { const n = m.length; return m.map((r, i) => r.map((_, j) => m[n - 1 - j][i])); }
    function fits(m, x, y) { for (let i = 0; i < m.length; i++) for (let j = 0; j < m.length; j++) if (m[i][j]) { const r = y + i, c = x + j; if (c < 0 || c >= BW || r >= BH) return false; if (r >= 0 && grid[r][c]) return false; } return true; }
    function spawn() { cur = next ? piece(next) : piece(fromBag()); next = fromBag(); holdUsed = false; lockT = 0;
      if (!fits(cur.m, cur.x, cur.y)) { over = true; if (score > best) { best = score; store.set('bestTetris', best); } upd(); later(() => gameOver('GAME OVER', 'Punkte: ' + score + '\nReihen: ' + lines + '\nRekord: ' + best), 400); } }
    function speed() { return Math.max(0.05, Math.pow(0.8 - (level - 1) * 0.007, level - 1)); }
    function lock() {
      for (let i = 0; i < cur.m.length; i++) for (let j = 0; j < cur.m.length; j++) if (cur.m[i][j]) { const r = cur.y + i; if (r < 0) { over = true; } else grid[r][cur.x + j] = cur.t; }
      if (over) { if (score > best) { best = score; store.set('bestTetris', best); } later(() => gameOver('GAME OVER', 'Punkte: ' + score + '\nRekord: ' + best), 300); return; }
      const full = []; for (let r = 0; r < BH; r++) if (grid[r].every(Boolean)) full.push(r);
      if (full.length) { flash = {rows: full, t: 0.25};
        score += [0, 100, 300, 500, 800][full.length] * level; lines += full.length; level = Math.max(level, +o.start + Math.floor(lines / 10)); }
      else spawn();
      upd();
    }
    function clearRows() { for (const r of flash.rows) { grid.splice(r, 1); grid.unshift(new Array(BW).fill(null)); } flash = null; spawn(); }
    function moveX(d) { if (fits(cur.m, cur.x + d, cur.y)) { cur.x += d; lockT = 0; return true; } return false; }
    function softDrop() { if (fits(cur.m, cur.x, cur.y + 1)) { cur.y++; score += 1; return true; } return false; }
    function hardDrop() { let n = 0; while (fits(cur.m, cur.x, cur.y + 1)) { cur.y++; n++; } score += n * 2; lock(); }
    function rotate() { const m = rot(cur.m); for (const [dx, dy] of [[0, 0], [-1, 0], [1, 0], [-2, 0], [2, 0], [0, -1]]) if (fits(m, cur.x + dx, cur.y + dy)) { cur.m = m; cur.x += dx; cur.y += dy; lockT = 0; return; } }
    function doHold() { if (holdUsed) return; const t = cur.t; if (hold) { cur = piece(hold); } else { spawn(); } hold = t; holdUsed = true; }
    function upd() { status('PUNKTE ' + score + '  REIHEN ' + lines + '  LEVEL ' + level); }
    spawn(); upd();
    setPad([{label: 'H', key: 'hold', cls: 't'}, {label: '◄', key: 'left'}, {label: '⟳', key: 'rot', cls: 't'}, {label: '►', key: 'right'}, {label: '▼', key: 'down'}, {label: '⤓', key: 'drop', cls: 'r'}]);
    function blk(x, y, s, col) { box(x, y, s, s, col); box(x, y, s, 2, C.W); box(x, y, 2, s, C.W); box(x + s - 2, y, 2, s, C.k); box(x, y + s - 2, s, 2, C.k); }
    function act(k) { if (over || flash) return; if (k === 'left') moveX(-1); if (k === 'right') moveX(1); if (k === 'down') softDrop(); if (k === 'rot' || k === 'up') rotate(); if (k === 'drop' || k === 'fire') hardDrop(); if (k === 'hold') doHold(); redraw(); }
    return {
      resize(w, h) { cell = Math.floor(Math.min((w - 8) / (BW + 5.5), (h - 8) / BH)); ox = Math.floor((w - cell * (BW + 5.5)) / 2); oy = Math.floor((h - cell * BH) / 2); },
      frame(dt) {
        if (over) return;
        if (flash) { flash.t -= dt; if (flash.t <= 0) clearRows(); return; }
        for (const k of ['left', 'right', 'down']) if (held.has(k)) { rep[k] -= dt; if (rep[k] <= 0) { act(k); rep[k] = k === 'down' ? 0.04 : 0.07; } } else rep[k] = 0.18;
        fallT += dt;
        if (fallT >= speed()) { fallT = 0; if (fits(cur.m, cur.x, cur.y + 1)) cur.y++; }
        if (!fits(cur.m, cur.x, cur.y + 1)) { lockT += dt; if (lockT > 0.5) lock(); }
      },
      draw() {
        box(ox - 3, oy - 3, cell * BW + 6, cell * BH + 6, C.lg); box(ox, oy, cell * BW, cell * BH, C.k);
        for (let c = 1; c < BW; c++) box(ox + c * cell, oy, 1, cell * BH, '#0a0a30');
        for (let r = 0; r < BH; r++) for (let c = 0; c < BW; c++) if (grid[r][c]) blk(ox + c * cell, oy + r * cell, cell, flash && flash.rows.includes(r) ? C.W : COL[grid[r][c]]);
        if (cur && !over && !flash) {
          let gy = cur.y; while (fits(cur.m, cur.x, gy + 1)) gy++;
          for (let i = 0; i < cur.m.length; i++) for (let j = 0; j < cur.m.length; j++) if (cur.m[i][j]) {
            if (gy + i >= 0) frameRect(ox + (cur.x + j) * cell + 1, oy + (gy + i) * cell + 1, cell - 2, cell - 2, COL[cur.t], 1);
            if (cur.y + i >= 0) blk(ox + (cur.x + j) * cell, oy + (cur.y + i) * cell, cell, COL[cur.t]); }
        }
        const px = ox + cell * BW + cell * 0.8, s = cell * 0.8;
        txt('NÄCHST', px, oy + cell * 0.8, cell * 0.9, C.Y);
        const nm = SH[next]; nm.forEach((r, i) => r.forEach((v, j) => { if (v) blk(px + j * s, oy + cell * 1.4 + i * s, s, COL[next]); }));
        txt('HALTEN', px, oy + cell * 6, cell * 0.9, C.Y);
        if (hold) SH[hold].forEach((r, i) => r.forEach((v, j) => { if (v) blk(px + j * s, oy + cell * 6.6 + i * s, s, holdUsed ? C.dg : COL[hold]); }));
        txt('REKORD', px, oy + cell * 11.5, cell * 0.9, C.Y); txt(String(Math.max(best, score)), px, oy + cell * 12.5, cell * 0.9, C.W);
        txt('LEVEL', px, oy + cell * 14, cell * 0.9, C.Y); txt(String(level), px, oy + cell * 15, cell * 0.9, C.W);
      },
      tap() { act('rot'); },
      swipe(d) { if (d === 'left') act('left'); if (d === 'right') act('right'); if (d === 'down') act('drop'); if (d === 'up') act('hold'); },
      key(k, d) { if (d) act(k); }
    };
  }
});

/* ===================== MINESWEEPER ===================== */
addGame({
  id: 'mines', name: 'Minesweeper', desc: 'Minen finden, konfigurierbar',
  options: [
    {id: 'size', label: 'FELD', choices: [['9x9x10', 'Anfänger 9×9'], ['16x16x40', 'Fortgeschr. 16×16'], ['30x16x99', 'Profi 16×30'], ['custom', 'Eigenes']], def: '9x9x10'},
    {id: 'rows', label: 'ZEILEN', type: 'num', min: 5, max: 40, def: 20, showIf: o => o.size === 'custom'},
    {id: 'cols', label: 'SPALTEN', type: 'num', min: 5, max: 30, def: 12, showIf: o => o.size === 'custom'},
    {id: 'mines', label: 'MINEN', type: 'num', min: 1, max: 999, def: 40, showIf: o => o.size === 'custom'}
  ],
  help: 'Tippen = aufdecken · Lange drücken = Flagge\nMit dem Knopf unten kannst du auf Flaggen-Modus umschalten.\nTippe auf eine Zahl, um die Nachbarn aufzudecken, wenn genug Flaggen liegen.',
  create(o) {
    let R, Cc, M;
    if (o.size === 'custom') { R = o.rows; Cc = o.cols; M = Math.min(o.mines, R * Cc - 9); }
    else { const [a, b, c] = o.size.split('x').map(Number); R = a; Cc = b; M = c; }
    let mine = [], open = [], flag = [], num = [], first = true, over = false, cell, ox, oy, flagMode = false, t0 = 0, tEnd = 0, opened = 0, boom = null, pressT = null;
    for (let i = 0; i < R * Cc; i++) { mine.push(false); open.push(false); flag.push(false); num.push(0); }
    const id = (r, c) => r * Cc + c;
    const nb = (r, c) => { const a = []; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { if (!dr && !dc) continue; const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < R && cc >= 0 && cc < Cc) a.push([rr, cc]); } return a; };
    function place(sr, sc) {
      const safe = new Set([id(sr, sc), ...nb(sr, sc).map(([r, c]) => id(r, c))]);
      const pool = []; for (let i = 0; i < R * Cc; i++) if (!safe.has(i)) pool.push(i);
      shuffle(pool).slice(0, M).forEach(i => mine[i] = true);
      for (let r = 0; r < R; r++) for (let c = 0; c < Cc; c++) num[id(r, c)] = nb(r, c).filter(([a, b]) => mine[id(a, b)]).length;
      t0 = Date.now();
    }
    function reveal(r, c) {
      const st = [[r, c]];
      while (st.length) { const [a, b] = st.pop(); const i = id(a, b); if (open[i] || flag[i]) continue; open[i] = true; opened++;
        if (!mine[i] && num[i] === 0) nb(a, b).forEach(x => { if (!open[id(x[0], x[1])]) st.push(x); }); }
    }
    function act(r, c, asFlag) {
      if (over) return; const i = id(r, c);
      if (asFlag) { if (!open[i]) { flag[i] = !flag[i]; if (navigator.vibrate) navigator.vibrate(15); } upd(); redraw(); return; }
      if (flag[i]) return;
      if (first) { place(r, c); first = false; }
      if (open[i]) { // Akkord
        if (num[i] && nb(r, c).filter(([a, b]) => flag[id(a, b)]).length === num[i]) nb(r, c).forEach(([a, b]) => { const j = id(a, b); if (!flag[j] && !open[j]) { if (mine[j]) boom = j; reveal(a, b); } });
      } else { if (mine[i]) boom = i; reveal(r, c); }
      if (boom != null) { over = true; tEnd = Date.now(); for (let k = 0; k < R * Cc; k++) if (mine[k]) open[k] = true; upd(); redraw(); later(() => gameOver('BUMM!', 'Auf eine Mine getreten.\nZeit: ' + secs() + ' s'), 700); return; }
      if (opened === R * Cc - M) { over = true; tEnd = Date.now(); for (let k = 0; k < R * Cc; k++) if (mine[k]) flag[k] = true;
        const key = 'mines.' + R + 'x' + Cc + 'x' + M; const best = store.get(key, null); const s = secs(); if (best == null || s < best) store.set(key, s);
        upd(); redraw(); later(() => gameOver('GEWONNEN!', 'Alle Minen gefunden!\nZeit: ' + s + ' s' + (best != null ? '\nRekord: ' + Math.min(best, s) + ' s' : '\nNeuer Rekord!')), 500); }
      upd(); redraw();
    }
    const secs = () => first ? 0 : Math.floor(((over ? tEnd : Date.now()) - t0) / 1000);
    function upd() { const f = flag.filter(Boolean).length; status('MINEN ' + (M - f) + '   ZEIT ' + secs() + 's   ' + (flagMode ? '[FLAGGEN-MODUS]' : '')); }
    const timer = setInterval(() => { if (!first && !over) upd(); }, 1000);
    setPad([{label: '⛏ AUFDECKEN', key: 'mode', cls: 't', flex: 2}]);
    function padLabel() { const b = $('pad').firstChild; if (b) { b.textContent = flagMode ? '⚑ FLAGGEN' : '⛏ AUFDECKEN'; b.className = flagMode ? 'r' : 't'; } }
    later(padLabel, 10);
    const NC = ['', C.B, C.g, C.R, C.b, C.r, C.c, C.k, C.dg];
    upd();
    function cellAt(x, y) { const c = Math.floor((x - ox) / cell), r = Math.floor((y - oy) / cell); return (r >= 0 && r < R && c >= 0 && c < Cc) ? [r, c] : null; }
    return {
      resize(w, h) { cell = Math.floor(Math.min(w / Cc, h / R)); ox = Math.floor((w - cell * Cc) / 2); oy = Math.floor((h - cell * R) / 2); },
      draw() {
        for (let r = 0; r < R; r++) for (let c = 0; c < Cc; c++) {
          const i = id(r, c), x = ox + c * cell, y = oy + r * cell;
          if (!open[i]) { box(x, y, cell, cell, C.W); box(x + 2, y + 2, cell - 2, cell - 2, C.dg); box(x + 2, y + 2, cell - 4, cell - 4, C.lg);
            if (flag[i]) { const s = cell; ctx.fillStyle = C.R; ctx.beginPath(); ctx.moveTo(x + s * .35, y + s * .2); ctx.lineTo(x + s * .75, y + s * .38); ctx.lineTo(x + s * .35, y + s * .55); ctx.fill(); box(x + s * .32, y + s * .2, Math.max(2, s * .07), s * .6, C.k); box(x + s * .22, y + s * .76, s * .5, Math.max(2, s * .07), C.k);
              if (over && !mine[i]) { ctx.strokeStyle = C.k; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 3, y + 3); ctx.lineTo(x + s - 3, y + s - 3); ctx.stroke(); } }
          } else {
            box(x, y, cell, cell, i === boom ? C.R : C.lg); frameRect(x, y, cell, cell, C.dg, 1);
            if (mine[i]) { circle(x + cell / 2, y + cell / 2, cell * .25, C.k); box(x + cell * .2, y + cell / 2 - 1, cell * .6, 2, C.k); box(x + cell / 2 - 1, y + cell * .2, 2, cell * .6, C.k); box(x + cell * .4, y + cell * .4, cell * .08, cell * .08, C.W); }
            else if (num[i]) txt(String(num[i]), x + cell / 2, y + cell / 2 + cell * .06, cell * .85, NC[num[i]], 'center', 'middle');
          }
        }
      },
      down(x, y) { this.sx = x; this.sy = y; const p = cellAt(x, y); if (!p) return; pressT = setTimeout(() => { pressT = 'done'; act(p[0], p[1], true); }, 380); },
      move(x, y) { if (pressT && pressT !== 'done' && Math.hypot(x - this.sx, y - this.sy) > 12) { clearTimeout(pressT); pressT = null; } },
      up() { if (pressT && pressT !== 'done') clearTimeout(pressT); },
      tap(x, y) { if (pressT === 'done') { pressT = null; return; } pressT = null; const p = cellAt(x, y); if (p) act(p[0], p[1], flagMode); },
      key(k, d) { if (k === 'mode' && d) { flagMode = !flagMode; padLabel(); upd(); } },
      destroy() { clearInterval(timer); if (pressT && pressT !== 'done') clearTimeout(pressT); }
    };
  }
});
